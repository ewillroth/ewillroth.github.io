<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardboard</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Mirrors resolveTheme() in src/store/settings.ts, including the v1 `theme` format.
      (function () {
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem('cardboard.settings') || '{}').state || {};
        } catch (e) {}
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme;
        if (s.mode) {
          var dark = s.mode === 'dark' || (s.mode === 'system' && systemDark);
          theme = dark ? s.darkTheme : s.lightTheme;
        } else if (s.theme && s.theme !== 'auto') {
          theme = s.theme;
        }
        document.documentElement.dataset.theme = theme || (systemDark ? 'night' : 'studio');
      })();
    </script>

    <link rel="stylesheet" crossorigin href="/board/assets/index-CW4FNY7b.css">

  </body>
</html>
